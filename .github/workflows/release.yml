name: Release

# Publishes to npm when a version tag is pushed: `git tag v0.2.0 && git push origin v0.2.0`.
# Uses npm trusted publishing (OIDC): npm trusts this workflow file in the `npm` environment, so no
# token is stored anywhere. A version that is already on npm is skipped, and the release still made.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # npm 11.5+ for trusted publishing
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm run check
      - run: node scripts/smoke-package.mjs
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@edgaze/sdk@$version" version >/dev/null 2>&1; then
            echo "@edgaze/sdk@$version is already on npm; skipping publish."
          else
            npm publish --provenance --access public
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="## $version" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
